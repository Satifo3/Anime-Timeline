<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIME TIMELINE — Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="eyebrow">1994 — 2026</div><h1>ANIME <span>TIMELINE</span></h1><p>放送開始順に、アニメ史を並べろ。</p></header>
<main>
<section id="start" class="panel">
<h2>PROTOTYPE</h2>
<p>カードの作品が、タイムラインのどこに入るか当てるゲームです。</p>
<div class="modes"><button onclick="startGame(10)">10問 PLAY</button><button class="ghost" onclick="startGame(20)">20問 PLAY</button></div>
<small>プロトタイプ収録：32作品 / 正式版目標：305作品</small>
</section>
<section id="game" class="hidden">
<div class="hud"><div>SCORE <b id="score">0</b></div><div>ROUND <b id="round">1</b>/<span id="maxRound">10</span></div><button class="tiny" onclick="location.reload()">QUIT</button></div>
<div class="question"><div class="tag" id="qtype">TV</div><div class="qtitle" id="qtitle"></div><div class="conceal">放送開始年　????</div></div>
<p class="instruction">「＋」を押して、この作品を入れる位置を選択</p>
<div id="timeline" class="timeline"></div>
<div id="result" class="result hidden"></div>
</section>
<section id="finish" class="panel hidden"><h2>RESULT</h2><div class="bigscore" id="finalScore"></div><p id="rank"></p><button onclick="location.reload()">もう一度</button></section>
</main>
<footer>ANIME TIMELINE / fan-made prototype · Data layer designed for independent factual references</footer>
<script src="anime-data.js"></script><script src="app.js"></script>
</body></html>

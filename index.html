<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ANIME TIMELINE — Prototype v0.4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><img class="appLogo" src="assets/icon-192.png" alt="ANIME TIMELINE icon"><div class="eyebrow">1994 — 2026</div><h1>ANIME <span>TIMELINE</span></h1><p>放送・公開開始順に、アニメ史を並べろ。</p></header>
<main>
<section id="start" class="panel">
<h2>PROTOTYPE v0.4</h2>
<p>カードの作品が、タイムラインのどこに入るか当てるゲームです。</p>
<div class="bestbox">BEST SCORE <b id="bestScore">---</b></div>
<div class="modes"><button onclick="startGame(10)">10問 PLAY</button><button class="ghost" onclick="startGame(20)">20問 PLAY</button></div>
<button class="recordBtn" onclick="showRecords()">RECORDS</button>
<small>プロトタイプ収録：<span id="count"></span>作品 / 正式版目標：305作品</small>
</section>

<section id="records" class="panel hidden">
<div class="recordHead"><h2>RECORDS</h2><button class="tiny" onclick="hideRecords()">BACK</button></div>
<p class="muted">この端末のブラウザに保存された上位10件</p>
<div id="recordList"></div>
<button class="danger" onclick="clearRecords()">記録をリセット</button>
</section>

<section id="game" class="hidden">
<div class="hud"><div>SCORE <b id="score">0</b></div><div>ROUND <b id="round">1</b>/<span id="maxRound">10</span></div><button class="tiny" onclick="location.reload()">QUIT</button></div>
<div class="question"><div class="tag" id="qtype">TV</div><div class="qtitle" id="qtitle"></div><div class="conceal">放送・公開開始　????</div></div>
<p class="instruction">「＋」を押して、この作品を入れる位置を選択</p>
<div id="timeline" class="timeline"></div>
<div id="result" class="result hidden"></div>
</section>

<section id="finish" class="panel hidden">
<h2>RESULT</h2>
<div class="bigscore" id="finalScore"></div>
<p id="rank"></p>
<p class="muted" id="recordMessage"></p>
<div class="modes"><button onclick="location.reload()">もう一度</button><button class="ghost" onclick="showRecordsFromFinish()">RECORDS</button></div>
</section>
</main>
<footer>ANIME TIMELINE / fan-made prototype · v0.4</footer>
<script src="anime-data.js"></script><script src="app.js"></script>
</body></html>
